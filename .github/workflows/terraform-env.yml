name: Terraform mot ett miljø

on:
  workflow_call:
    inputs:
      miljo:
        description: Miljøet som skal rulles ut
        required: true
        type: string
      plan_miljo:
        description: GitHub-environmentet plan-jobben kjører under
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.plan_miljo }}

    defaults:
      run:
        working-directory: terraform-projects/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for ${{ inputs.miljo }}
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-webapp-${{ inputs.miljo }}" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/${{ inputs.miljo }}/webapp.tfstate"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Ta vare på planen
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.miljo }}-${{ github.sha }}
          path: terraform-projects/stacks/webapp/tfplan
          retention-days: 5

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.miljo }}

    defaults:
      run:
        working-directory: terraform-projects/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent planen
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.miljo }}-${{ github.sha }}
          path: terraform-projects/stacks/webapp

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/${{ inputs.miljo }}/webapp.tfstate"

      - name: Apply
        run: terraform apply tfplan
