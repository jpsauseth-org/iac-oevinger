name: Rull ut webapp

on:
  push:
    branches: [main]
    paths:
      - 'terraform-projects/**'
      - '.github/workflows/deploy-webapp.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: webapp-dev
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: terraform-projects/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-dev" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/dev/webapp.tfstate"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Ta vare på planen
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-dev-${{ github.sha }}
          path: terraform-projects/stacks/webapp/tfplan
          retention-days: 5

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: terraform-projects/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent planen
        uses: actions/download-artifact@v8
        with:
          name: tfplan-dev-${{ github.sha }}
          path: terraform-projects/stacks/webapp

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/dev/webapp.tfstate"

      - name: Apply
        run: terraform apply tfplan