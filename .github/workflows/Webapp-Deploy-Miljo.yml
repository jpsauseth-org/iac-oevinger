name: Rull ut webapp

on:
  push:
    branches: [main]
    paths:
      - 'modul-5.2/**'
      - '.github/workflows/Webapp-Deploy-Miljo.yml'
      - '.github/workflows/terraform-env.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: webapp
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: dev
      plan_miljo: dev
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: test
      plan_miljo: test
    secrets: inherit

  prod:
    needs: test
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: prod
      plan_miljo: prod-plan
    secrets: inherit